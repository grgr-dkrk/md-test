name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: local-models-presentation/requirements.txt
      - name: Install build dependencies
        run: python -m pip install -r local-models-presentation/requirements.txt
      - name: Generate HTML from Markdown
        run: python local-models-presentation/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: local-models-presentation/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
