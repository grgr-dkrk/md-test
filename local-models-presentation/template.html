<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:#20252b;background:#f5f6f8;font-size:16px;line-height:1.9}
*{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:36px auto;padding:42px 56px 64px;background:#fff;border:1px solid #e1e5ea;border-radius:8px}h1{font-size:1.8rem;line-height:1.5;margin:0 0 40px;font-weight:700}h2{font-size:1.45rem;line-height:1.55;margin:48px 0 20px;padding-bottom:9px;border-bottom:2px solid #dce3eb}h3{font-size:1.18rem;line-height:1.6;margin:34px 0 14px}h4{font-size:1.05rem;margin:24px 0 12px}h1,h2,h3,h4{overflow-wrap:anywhere}p{margin:14px 0}ul{padding-left:1.6em;margin:14px 0}li{padding-left:.15em;margin:5px 0}li>ul{margin:4px 0 10px}a{color:#1761ac;overflow-wrap:anywhere;text-underline-offset:3px}a:focus-visible{outline:2px solid #1761ac;outline-offset:3px}strong{font-weight:750}.free{color:#175baf}.paid{color:#b52a32}figure{margin:20px 0 30px}img{max-width:100%;height:auto;display:block;border:1px solid #e1e5ea;border-radius:4px}video{display:block;width:100%;max-height:580px;background:#17191c;border:1px solid #dce3eb;border-radius:4px}audio{display:block;width:min(100%,560px)}.image-comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start;margin:20px 0 30px}.image-comparison figure{margin:0;padding:14px;border:1px solid #dce3eb;border-radius:6px;background:#fafbfc}.image-comparison figcaption{font-weight:650;margin-bottom:10px}.image-comparison img{width:100%;height:auto}.table-scroll{overflow-x:auto;margin:22px 0;border:1px solid #dce3eb;border-radius:5px}table{border-collapse:collapse;width:100%;font-size:.9rem;line-height:1.75}th,td{padding:12px 14px;border-bottom:1px solid #dce3eb;border-right:1px solid #e8ebef;vertical-align:top;text-align:left;min-width:95px}th{background:#edf1f6;font-weight:650}tr:last-child td{border-bottom:0}td:last-child,th:last-child{border-right:0}tbody tr:nth-child(even){background:#f9fafb}pre{padding:20px;background:#f2f4f7;border:1px solid #e1e5ea;border-radius:5px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8}code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.9em}
@media(max-width:700px){:root{font-size:15px}main{margin:0;padding:24px 20px 48px;border:0;border-radius:0}h1{font-size:1.5rem}h2{font-size:1.3rem;margin-top:36px}th,td{padding:10px}video{max-height:420px}}
@media(max-width:560px){.image-comparison{grid-template-columns:1fr;gap:12px}}
@media print{@page{margin:16mm}body{background:white}main{max-width:none;margin:0;padding:0;border:0}h2,h3,h4{break-after:avoid}figure,pre,tr{break-inside:avoid}.table-scroll{overflow:visible}img{max-height:380px;object-fit:contain}video{max-height:240px}a{color:inherit}}
</style>
</head>
<body>
<main>
<h1>{{title}}</h1>
<article>{{body}}</article>
</main>
</body>
</html>
